appId: io.markdesk.desktop
productName: MarkDesk
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
fileAssociations:
  - ext: md
    name: Markdown 文档
    description: Markdown 文档
    role: Editor
  - ext: markdown
    name: Markdown 文档
    description: Markdown 文档
    role: Editor
win:
  target:
    - nsis
  artifactName: MarkDesk-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  category: Utility
mac:
  target:
    - dmg
  category: public.app-category.productivity
