name: build

# 三平台构建：手动触发或推送 v* 标签时构建并发布 Release。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            bundles: dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      - name: Run unit tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build bundles
        shell: bash
        run: |
          npx tauri build --bundles ${{ matrix.bundles }}
          # Windows 产物按仓库约定去掉 -setup 后缀。
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            node scripts/rename-bundle.mjs
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: markdesk-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: bundles/**
          generate_release_notes: true
