<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 生产构建经 file:// 加载时 onHeadersReceived 不生效，这份 meta 即
         实际生效的 CSP，必须与 security.ts 的 contentSecurityPolicy()
         保持一致（img-src 需含 markdesk-resource:，否则文档相对图片会被
         CSP 拦截而无法显示）。Tauri 构建复用同一 bundle：其 IPC 走
         ipc:/http://ipc.localhost、自定义协议走 http://markdesk-resource.localhost，
         一并列入白名单（Electron 下这些来源不存在，无副作用）。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' markdesk-resource: http://markdesk-resource.localhost https: http: data:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost http://markdesk-resource.localhost; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <title>MarkDesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main/main.tsx"></script>
  </body>
</html>
